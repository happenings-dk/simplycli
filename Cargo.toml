[package]
name = "simply-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Command line client for the Simply.com API"
authors = ["Happenings Group A/S"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/happenings-dk/simplycli"
keywords = ["simply", "dns", "domains", "cli"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "simply"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
keyring = { version = "3.6", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
